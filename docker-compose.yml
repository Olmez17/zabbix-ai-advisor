services:
  mysql:
    image: mysql:8.4
    container_name: zabbix-mysql
    restart: unless-stopped
    command:
    - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbixpass
    volumes:
      - mysql-data:/var/lib/mysql

  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-7.4-latest
    container_name: zabbix-server
    depends_on:
      - mysql
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbixpass
    ports:
      - "10051:10051"

  zabbix-web:
    image: zabbix/zabbix-web-apache-mysql:ubuntu-7.4-latest
    container_name: zabbix-web
    depends_on:
      - zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbixpass
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Europe/Istanbul
    ports:
      - "8080:8080"

  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.4-latest
    container_name: zabbix-agent
    restart: unless-stopped
    privileged: true
    network_mode: host
    group_add:
      - "973"
    environment:
      ZBX_SERVER_HOST: 127.0.0.1,172.21.0.0/16
      ZBX_ACTIVE_ALLOW: "false"
      ZBX_HOSTNAME: "Zabbix server"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./agent2-nginx.conf:/etc/zabbix/zabbix_agent2.d/nginx.conf:ro
     


  ai-advisor:
    build: ./zabbix-ai-advisor
    container_name: zabbix-ai-advisor
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      DB_PATH: "/data/alerts.db"
    volumes:
      - ai-advisor-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8001:8001"

volumes:
  mysql-data:
  ai-advisor-data:
 
